
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University GPA Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>University GPA & CGPA Calculator</h2>

    <div class="container">

        <h3>Student Information</h3>

        <label>Student Name:</label>
        <input type="text" id="studentName" placeholder="Enter your name">

        <h3>Course Information</h3>

        <label>Course Code:</label>
        <input type="text" id="courseCode" placeholder="e.g. CSC101">

        <label>Course Unit:</label>
        <input type="number" id="courseUnit" placeholder="Enter course unit">

        <label>Grade:</label>
        <select id="grade">
            <option value="">Select Grade</option>
            <option value="5">A</option>
            <option value="4">B</option>
            <option value="3">C</option>
            <option value="2">D</option>
            <option value="1">E</option>
            <option value="0">F</option>
        </select>

        <button onclick="addCourse()">Add Course</button>

        <h3>Added Courses</h3>

        <table>
            <thead>
                <tr>
                    <th>Course</th>
                    <th>Unit</th>
                    <th>Grade Point</th>
                </tr>
            </thead>

            <tbody id="courseList">
            </tbody>
        </table>

        <h3>Previous Academic Record</h3>

        <label>Previous CGPA:</label>
        <input type="number" id="previousCGPA" placeholder="Enter previous CGPA" min="0" max="5" step="0.01">

        <label>Previous Total Course Units:</label>
        <input type="number" id="previousUnits" placeholder="Enter previous units" min="0" step="1">

        <button onclick="calculateGPA()">Calculate GPA & CGPA</button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
